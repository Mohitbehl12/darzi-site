<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Darzi — design custom clothes and capture your measurements from your phone. Test build.">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Darzi Digital Tailor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: fitting room — quiet paper ground, garments shown on pattern-paper "fitting cards", measurements set in mono on tape-yellow tags */
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE7; --ink:#131715; --muted:#5B6560; --line:#D7DDD8;
  --accent:#1E4D3F; --accent-ink:#F2F7F4; --accent-soft:#DAE7E0; --tape:#E4B12B; --tape-ink:#2A2106;
  --good:#2D7A4D; --warn:#9C6410; --bad:#AE412D; --mq:#C9D0CB; --grid:rgba(30,77,63,.10);
  --shadow:0 1px 2px rgba(19,23,21,.05),0 10px 30px rgba(19,23,21,.07);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1210; --surface:#161C19; --sunk:#1D2521; --ink:#E8EDEA; --muted:#98A49E; --line:#29332E;
  --accent:#7DC3A7; --accent-ink:#0A1511; --accent-soft:#1D372E; --tape:#E8BA36; --tape-ink:#221A03;
  --good:#5DBE85; --warn:#E2A644; --bad:#E57D66; --mq:#313B36; --grid:rgba(125,195,167,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1210; --surface:#161C19; --sunk:#1D2521; --ink:#E8EDEA; --muted:#98A49E; --line:#29332E;
  --accent:#7DC3A7; --accent-ink:#0A1511; --accent-soft:#1D372E; --tape:#E8BA36; --tape-ink:#221A03;
  --good:#5DBE85; --warn:#E2A644; --bad:#E57D66; --mq:#313B36; --grid:rgba(125,195,167,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2.4rem,5.4vw,4.4rem)}
h2{font-size:clamp(1.8rem,3.4vw,2.7rem)}
h3{font-size:1.35rem}
h1 em,h2 em{font-style:italic;color:var(--accent)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-tape{background:var(--tape);color:var(--tape-ink)}
.btn-lg{padding:14px 24px;font-size:1rem}
.btn-sm{padding:7px 13px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;gap:4px}
.links button{background:none;border:0;padding:8px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.9rem}
.links button:hover,.links button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.icons{display:flex;gap:4px;align-items:center}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.drawer{border-top:1px solid var(--line);padding-block:10px 16px}
.drawer button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px;font-size:1.05rem;border-bottom:1px solid var(--line);cursor:pointer}
@media (max-width:1020px){.links{display:none}.menu-btn{display:grid}.nav .cta-nav{display:none}}

/* hero */
.hero{padding-block:48px 64px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.lede{font-size:1.14rem;color:var(--muted);max-width:34em}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.trust{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.88rem;color:var(--muted)}
.trust li{display:flex;align-items:center;gap:8px}
.trust li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tape)}
.fitcard{position:relative;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;aspect-ratio:3/3.6;max-width:100%;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:14px 14px}
.fitcard .layer{position:absolute;inset:4% 6% 6%}
.fitcard svg{width:100%;height:100%;display:block}
.scanbar{position:absolute;left:0;right:0;height:70px;top:10%;background:linear-gradient(180deg,transparent,var(--grid),transparent);border-bottom:1px solid var(--accent);opacity:.7;animation:scan 5.5s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:78%}}
.chipfloat{position:absolute;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:.82rem}
.chipfloat b{display:block;font-size:.9rem}
.cf1{left:16px;bottom:16px}
.cf2{right:16px;top:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.tape-tag rect{fill:var(--tape)}
.tape-tag text{fill:var(--tape-ink);font-family:var(--mono);font-size:8.6px;font-weight:500}
.mline{stroke:var(--accent);stroke-width:1.2;fill:none}
.mend{fill:var(--accent)}
.draw{stroke-dasharray:240;animation:draw 1.6s ease-out both}
@keyframes draw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding-block:28px 40px}.fitcard{aspect-ratio:3/3.3}}

/* sections */
.band{padding-block:72px}
.band-alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.sec-head p{max-width:36em;color:var(--muted)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step4{display:flex;flex-direction:column;gap:12px}
.step4 .ill{aspect-ratio:4/3;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.step4 .ill svg{width:62%;height:84%}
.step4 h3{font-size:1.25rem;display:flex;gap:10px;align-items:baseline}
.step4 h3::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.8rem;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;flex:none;transform:translateY(-3px)}
@media (max-width:900px){.steps4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .thumb{aspect-ratio:3/3.4;border-radius:12px;background:var(--sunk);overflow:hidden}
.cat .thumb svg{width:100%;height:100%}
.cat b{font-weight:600;font-size:.98rem}
.cat span{font-size:.8rem;color:var(--muted)}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,1fr)}}

.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split>*{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:28px}}
.prompt-demo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.quote{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:.74rem;padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.tag.tp{background:var(--tape);color:var(--tape-ink)}
.mini-res{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;font-size:.9rem;align-items:center}
.conf{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.conf.High{color:var(--good)}.conf.Medium{color:var(--warn)}.conf.Low{color:var(--bad)}.conf.Verified,.conf.Edited{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.mtable tr.needs td{background:color-mix(in srgb,var(--tape) 10%,transparent)}
.mtable .tip{color:var(--muted);display:block;max-width:34ch;line-height:1.35;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fitmeter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.fitmeter.lock{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fitnum{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.fitmeter.lock .fitnum{color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--tape);transition:width .4s}
.fitmeter.lock .bar span{background:var(--accent)}
.gates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gates li{display:flex;gap:10px;align-items:flex-start}
.gates li div{display:flex;flex-direction:column;min-width:0}
.gates b{font-size:.9rem;font-weight:600}
.gi{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;border:1.5px solid var(--line);color:var(--muted)}
.gates li.ok .gi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gates li.bad .gi{border-color:var(--bad);color:var(--bad)}
.refgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.refgrid{grid-template-columns:1fr 1fr}}
.guarantee{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;background:var(--accent-soft)}
.seal{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;font-weight:600}
.privacy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{border-top:2px solid var(--accent);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.pcard b{font-size:1.02rem}
@media (max-width:760px){.privacy-grid{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:40px;color:var(--muted);font-size:.88rem}
.foot{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.foot button:hover{color:var(--ink)}

/* flow */
.page{padding-block:28px 72px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:26px;scrollbar-width:none}
.stepper button{flex:none;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.stepper button i{font-style:normal;font-family:var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:.72rem}
.stepper button.done{color:var(--ink)}
.stepper button.done i{background:var(--accent-soft);color:var(--accent)}
.stepper button.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.stepper button.cur i{background:var(--accent);color:var(--accent-ink)}
.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:46em}
.page-head p{color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-family:var(--body);font-weight:700;font-size:1rem;letter-spacing:0}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
@media (max-width:920px){.studio{grid-template-columns:1fr}.studio .preview-col{order:-1;position:static!important}}
.preview-col{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:9px;padding-block:14px;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group>label,.glabel{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:.72rem}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
textarea,input[type=text],input[type=number],input[type=email],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:.95rem}
textarea{min-height:92px;resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;font-size:.85rem;position:relative;min-height:92px}
.drop:hover{border-color:var(--accent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.preview-box{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:14px 14px}
.preview-box .gwrap{aspect-ratio:3/3.5;max-width:100%;display:grid;place-items:center;padding:10px 14px}
.preview-box .gwrap svg{width:100%;height:100%;max-height:520px}
.ai-label{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.vtabs{position:absolute;right:12px;top:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.vtabs button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.76rem;cursor:pointer;color:var(--muted)}
.vtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:.9rem}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600;min-width:0}
.price-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-family:var(--display);font-size:1.8rem}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rec{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface);font-size:.8rem}
.rec .thumb{aspect-ratio:1;background:var(--sunk);border-radius:8px;overflow:hidden}
.rec .thumb svg{width:100%;height:100%}
.rec b{font-size:.84rem}
@media (max-width:520px){.recs{grid-template-columns:1fr 1fr}.uploads{grid-template-columns:1fr}}

.mq{fill:var(--mq);stroke:none}
.mqs{stroke:var(--mq);fill:none}

/* measure */
.measure-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:start}
@media (max-width:860px){.measure-grid{grid-template-columns:1fr}}
.cam{position:relative;border-radius:22px;background:#0F1412;overflow:hidden;aspect-ratio:3/4;max-height:72vh;margin-inline:auto;width:100%;max-width:520px}
.cam .guide{position:absolute;inset:6% 10%}
.cam .guide svg{width:100%;height:100%}
.cam .corner{position:absolute;width:28px;height:28px;border:2.5px solid #E4B12B}
.cam .c1{left:7%;top:4%;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam .c2{right:7%;top:4%;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.cam .c3{left:7%;bottom:4%;border-right:0;border-top:0;border-radius:0 0 0 8px}
.cam .c4{right:7%;bottom:4%;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.72rem;color:#DDE6E1}
.cam .hud span{background:rgba(0,0,0,.45);padding:4px 9px;border-radius:999px}
.cam .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:6rem;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.cam .scanline{position:absolute;left:8%;right:8%;height:2px;background:#7DC3A7;box-shadow:0 0 18px 4px rgba(125,195,167,.55);animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:8%}50%{top:90%}}

.instr{font-family:var(--display);font-size:1.25rem;line-height:1.35}

.proc li .dot{background:var(--line)}

.spinner{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}

.mtable input{width:92px;padding:7px 9px;font-family:var(--mono);text-align:right}

.sumtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumtiles div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}

 for(const p of ['Zari border','Chikankari','Ajrakh print','Madras check','Floral'])if(t.includes(p.split(' ')[0].toLowerCase())){f.pat=p;u.push(p)}
 for(const fb of ['linen','silk','khadi','wool','velvet','oxford','chanderi','crepe','organza','mul','kota','ripstop','knit','seersucker'])if(t.includes(fb)){f.fabric=fb;u.push(fb[0].toUpperCase()+fb.slice(1))}

 for(const[o,re]of occ)if(re.test(t)){f.occ=o;u.push(o[0].toUpperCase()+o.slice(1))}
 const pm=t.match(/(?:under|below|less than|within|upto|up to)\s*(?:₹|rs\.?|inr)?\s*([\d,]+)\s*(k)?/);
 if(pm){f.max=parseInt(pm[1].replace(/,/g,''))*(pm[2]?1000:1);u.push('Under '+inr(f.max))}
 let res=CATALOG.filter(it=>(!f.cat||it.spec.category===f.cat)&&(!f.max||it.price<=f.max)&&(!f.trend||it.trend)).map(it=>{let sc=1+(it.trend?.5:0);if(f.pat&&it.spec.pattern===f.pat)sc+=3;if(f.color&&it.spec.color===f.color)sc+=3;if(f.fit&&it.spec.fit===f.fit)sc+=2;if(f.fabric&&it.spec.fabric.toLowerCase().includes(f.fabric))sc+=2;if(f.occ&&it.occ.includes(f.occ))sc+=3;return{it,sc}});
 const strict=f.color||f.occ||f.fabric||f.pat;if(strict)res=res.filter(r=>r.sc>=3);

  :`<circle cx="100" cy="38" r="18"/><path d="M76,62 Q100,56 124,62 L132,72 Q138,124 128,172 L130,202 L70,202 L72,172 Q62,124 68,72 Z"/><path d="M70,74 L50,170 L45,194 M130,74 L150,170 L155,194" stroke-width="12" stroke-linecap="round"/><path d="M86,200 L74,342 M114,200 L126,342" stroke-width="17" stroke-linecap="round"/>`;

const CAP=[
 {k:'front',t:'Front',instr:['Stand in front of your camera.','Keep your feet shoulder-width apart.','Keep your arms slightly away from your body.','Make sure your entire body is visible.']},

V.measure=()=>{
 const M=S.m;let body='';
 if(M.stage==='intro'){
  body=`<div class="measure-grid"><div class="panel stack" style="gap:18px">
   <h3>Before you start</h3>
   <ul class="checklist"><li>Wear fitted clothing, or tuck in loose layers.</li><li>Prop your phone at waist height, about 2.5 m away, or ask someone to hold it.</li><li>Use a bright room with a plain wall behind you.</li><li>It takes about two minutes: front, side and back.</li></ul>
   <label class="consent"><input type="checkbox" id="c1" data-act="consent" ${M.consent?'checked':''}><span><b>I agree to body capture.</b><br><span class="small muted">The camera captures images of your body to calculate measurements. They are encrypted in transit and processed securely.</span></span></label>
   <label class="consent"><input type="checkbox" id="c2" data-act="consent2" ${M.keep?'checked':''}><span><b>Keep my capture photos</b> <span class="muted">(optional)</span><br><span class="small muted">Off by default. When off, photos are deleted as soon as measurements are computed and only the numbers are saved.</span></span></label>
   <div class="row"><button class="btn btn-primary btn-lg" data-act="m-start" ${M.consent?'':'disabled'}>Start measuring</button><button class="linkbtn" data-act="m-manual">Enter measurements manually</button></div>

 }else if(M.stage==='setup'){

   <h3>Who are we measuring?</h3>
   <div class="chips">${S.profiles.map(p=>chip('m-prof',p.name,prof(M.profileId)?.name)).join('')}<button class="chip" data-act="m-newprof">+ New profile</button></div>
   <div id="newprof" hidden><input type="text" id="np-name" placeholder="Profile name, e.g. Son"></div>
   <div class="stack"><span class="glabel">Height</span><div class="row"><input type="number" id="m-h" inputmode="decimal" value="${esc(M.height)}" placeholder="${M.unit==='cm'?'e.g. 175':'e.g. 69'}" style="max-width:160px"><div class="chips">${chip('m-unit','cm',M.unit)}${chip('m-unit','in',M.unit)}</div></div><p class="small muted">Your height is the scale reference that turns pixels into inches, so enter it as accurately as you can.</p></div>
   <div class="row"><button class="btn btn-primary" data-act="m-go">Continue to capture</button><button class="btn btn-ghost" data-act="m-back">Back</button></div></div>`;
 }else if(M.stage==='capture'){
  const st=CAP[M.step];
  body=`<div class="measure-grid">
   <div class="stack"><div class="cam">${M.caps[M.step]&&M.caps[M.step]!=='sim'?`<img class="shot" src="${M.caps[M.step]}" alt="">`:''}<div class="guide">${figure(st.k==='side'?'side':'front')}</div><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <div class="hud"><span>${st.t.toUpperCase()} · ${M.step+1}/3</span><span>${M.busy?'HOLD STILL':M.caps[M.step]?'CAPTURED ✓':'FULL BODY ✓ · LIGHT OK'}</span></div>
    ${M.busy?`<div class="scanline"></div><div class="count" id="count">3</div>`:''}</div></div>
   <div class="stack" style="gap:16px">
    <div class="capsteps">${CAP.map((c,i)=>`<button data-act="m-step" data-i="${i}" class="${i===M.step?'cur':''}"><b>${c.t}</b>${M.caps[i]?'<span class="ok">Captured</span>':'<span class="muted">Pending</span>'}</button>`).join('')}</div>
    <div class="panel stack" style="gap:12px">${st.instr.map((t,i)=>`<p class="${i===0?'instr':''}">${esc(t)}</p>`).join('')}</div>
    <div class="row"><button class="btn btn-primary btn-lg" data-act="m-cap" ${M.busy?'disabled':''}>${M.caps[M.step]?'Retake':'Capture '+st.t.split(' ')[0].toLowerCase()}</button><label class="btn btn-ghost" style="position:relative">Upload a photo<input type="file" accept="image/*" data-upload="cap" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Upload a photo for this view"></label></div>
    <p class="notice small">Camera access isn't available in this preview, so capture is simulated. On the live site and app this step uses your phone camera with live pose guidance.</p>

   </div></div>`;
 }else{
  const items=['Detecting body keypoints','Estimating body contour','Computing 18 measurements','Scoring confidence',M.keep?'Saving encrypted photos':'Deleting capture photos'];

 }
 return`<div class="wrap page">${stepper('measure')}<div class="page-head"><p class="eyebrow">Step 3 · 360° digital measurement</p><h2>Capture your measurements</h2><p>Guided capture from your phone. You'll review every number before it's used.</p></div>${body}</div>`;

V.review=()=>{
 const p=prof(S.reviewId)||activeProfile();
 if(!p||!p.m)return`<div class="wrap page">${stepper('review')}<div class="empty"><b>No measurements yet for ${esc(p?p.name:'this profile')}</b><p>Capture them with your phone or enter them manually.</p><button class="btn btn-primary" data-go="measure">Start measuring</button></div></div>`;
 const F=fitScore(p),open=new Set(F.unc.filter(([k])=>!['Verified','Edited'].includes(p.m[k].c)).map(([k])=>k));
 let rows='',g='';
 MEAS.forEach(([k,l,grp])=>{if(grp!==g){g=grp;rows+=`<tr class="grp"><td colspan="4">${grp}</td></tr>`}const x=p.m[k];rows+=`<tr${open.has(k)?' class="needs"':''}><td>${l}${open.has(k)?`<br><span class="small tip">${esc(TAPE[k]||'Measure with a soft tape, snug but not tight.')}</span>`:''}</td><td><input type="number" step="0.1" id="m-${k}" value="${x.v}" data-meas="${k}" aria-label="${l} in inches"> <span class="small muted">in</span><div class="cm">${cm(x.v)} cm</div></td><td><span class="conf ${x.c}">${x.c}</span></td><td>${open.has(k)?`<button class="btn btn-sm btn-ghost" data-act="verify" data-k="${k}">Tape matches</button>`:''}</td></tr>`});
 const meter=`<div class="fitmeter ${F.score===100?'lock':''}"><div class="row"><span class="fitnum">${F.score}%</span><div><b>${F.score===100?'Fit Locked':'Fit score'}</b><p class="small muted">${F.score===100?'Covered by the 100% Fit Guarantee.':'Complete the steps below to lock 100% fit.'}</p></div></div>
  <div class="bar"><span style="width:${F.score}%"></span></div>
  <ul class="gates">${F.gates.map(([t,v,s])=>`<li class="${v>=1?'ok':''}"><span class="gi">${v>=1?'✓':Math.round(v*25)}</span><div><b>${t}</b><span class="small muted">${s}</span></div></li>`).join('')}</ul></div>`;
 const ri=F.ri;
 return`<div class="wrap page">${stepper('review')}
 <div class="page-head"><p class="eyebrow">Step 4 · ${esc(p.name)}</p><h2>Review &amp; Adjust Measurements</h2><p>A phone scan gets you close. These steps take it to an exact fit: confirm the uncertain values with a tape, cross-check against a shirt that already fits you, and let the consistency checks catch typos. Edited values are made exactly as entered.</p></div>
 <div class="measure-grid"><div class="stack" style="gap:20px">
  <div class="panel tscroll" style="padding:6px 8px"><table class="mtable"><thead><tr><th>Measurement</th><th>Value</th><th>Confidence</th><th><span class="sr">Verify</span></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="panel stack" style="gap:14px"><div class="row"><h3>Cross-check with a shirt that fits you</h3><span class="spacer"></span>${ri&&!ri.length?'<span class="pill on">Matches</span>':''}</div>
   <p class="small muted">Lay your best-fitting shirt flat and measure it. This is the most reliable way to catch a scan error, because the shirt has already been proven on your body.</p>
   <div class="refgrid">${REF.map(([k,l])=>`<label class="stack" style="gap:4px"><span class="small">${l}</span><input type="number" step="0.1" inputmode="decimal" id="ref-${k}" data-ref="${k}" value="${esc(p.ref?.[k]||'')}" placeholder="in"></label>`).join('')}</div>
   ${ri&&ri.length?ri.map(x=>`<div class="notice warn small row"><span style="flex:1;min-width:200px">${esc(x.msg)}</span><button class="btn btn-sm btn-ghost" data-act="ref-fix" data-k="${x.k}" data-v="${x.fix}">Use ${x.fix} in</button><button class="btn btn-sm btn-ghost" data-act="ref-keep" data-k="${x.k}">Scan is right</button></div>`).join(''):''}
  </div>
  <div class="panel stack" style="gap:10px"><h3>Consistency checks</h3><ul class="gates">${F.ch.map(([t,ok])=>`<li class="${ok?'ok':'bad'}"><span class="gi">${ok?'✓':'!'}</span><div><b>${t}</b>${ok?'':'<span class="small muted">One of these values is probably a typo or a scan error. Re-measure it.</span>'}</div></li>`).join('')}</ul></div>
 </div>
 <div class="stack" style="gap:16px;position:sticky;top:86px">
  ${meter}
  <div class="panel stack"><span class="glabel">Preferred fit for this profile</span><div class="chips">${FITS.map(f=>chip('p-fit',f,p.fit)).join('')}</div>
   ${Object.keys(p.adj||{}).length?`<p class="small">Fit memory from your feedback: ${Object.entries(p.adj).map(([k,v])=>`${k} ${v>0?'+':''}${v} in`).join(', ')}</p>`:''}
   <p class="small muted">${p.photos?'Capture photos are stored, encrypted. <button class="linkbtn" data-act="del-photos" data-id="'+p.id+'">Delete photos</button>':'No capture photos stored. Only these numbers are saved.'}</p></div>
  <div class="row"><button class="btn ${F.score===100?'btn-primary':'btn-ghost'} btn-lg" data-act="confirm-meas">${F.score===100?'Lock fit &amp; continue':`Continue at ${F.score}%`}</button><button class="btn btn-ghost" data-act="rescan">Retake scan</button></div>
 </div></div></div>`;
};

function finished(d,m,adj){return finished0(d,m).map(([l,v])=>[l,v+((adj||{})[l]||0)])}
function finished0(d,m){const e=EASE[d.fit];const lenAdj={'Extended':2,'Cropped':-2.5,'Mid-calf':4,'Short kurta':-6,'Knee length':0}[d.length]||0;const base=d.category==='kurta'?m.shirtLen.v+9:d.category==='blouse'?m.shirtLen.v*.5:m.shirtLen.v;
 const sl={Full:m.arm.v,'Three-quarter':m.arm.v*.72,Half:m.arm.v*.4,Sleeveless:0}[d.sleeves]??m.arm.v;
 const kind=CATS[d.category].kind;
 if(kind==='bottom')return[['Waist',m.trouserWaist.v+1],['Hip',m.hip.v+e],['Thigh',m.thigh.v+2.5],['Inseam',m.inseam.v-(d.length==='Ankle'?1.5:d.length==='Cropped'?4:0)]];
 return[['Chest',m.chest.v+e],['Waist',m.waist.v+e+.5],['Shoulder',m.shoulder.v+.3],['Length',base+lenAdj],...(sl?[['Sleeve',sl]]:[])].concat(d.length==='Longer back'?[['Back length',base+1]]:[]);
}

function rotSVG(a){const r=a*Math.PI/180,cs=Math.cos(r),sx=Math.max(.36,Math.abs(cs)).toFixed(3);const view=cs>=0?'front':'back';
 return garmentSVG(S.draft,view).replace(/<g stroke=/, `<g transform="translate(150 0) scale(${sx} 1) translate(-150 0)"><g stroke=`).replace(/<\/svg>$/,'</g></svg>')}

 <div class="panel arch"><div class="tier"><span>Clients</span><span class="box acc">Website</span><span class="box">iOS app</span><span class="box">Android app</span><span class="box">Workshop dashboard</span></div>

 <div class="stack" style="gap:22px">${[
 ['What we collect','Photos from your guided capture (front, side, back), the measurements calculated from them, your height, fit preferences, designs and orders.'],

/* ---------------- render + routing ---------------- */
let spinTimer=null;
function render(){
 const v=V[S.view]?S.view:'home';
 $('#view').innerHTML=V[v]();
 document.querySelectorAll('.links button[data-go]').forEach(b=>{if(b.dataset.go===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const cc=$('#cartCount');cc.textContent=S.cart.length;cc.hidden=!S.cart.length;
 if(v==='preview'){const r=$('#angle');if(r)r.addEventListener('input',e=>setAngle(+e.target.value))}
}
function go(v,keep){S.view=v;$('#drawer').hidden=true;if(v!=='preview')stopSpin();try{history.replaceState(null,'','#'+v)}catch(e){}render();if(!keep)window.scrollTo({top:0})}
function setAngle(a){S.view3d.angle=a;const b=$('#rotbox');if(b)b.innerHTML=rotSVG(a);const l=$('#angval');if(l)l.textContent=a+'°';const r=$('#angle');if(r&&+r.value!==a)r.value=a}
function stopSpin(){clearInterval(spinTimer);spinTimer=null;S.view3d.auto=false}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function setDraft(s,keepPrompt){S.draft=normalize(s);S.variation=0;persist();if(!keepPrompt)S.understood=[]}

function capture(){
 const M=S.m;M.busy=true;render();let n=3;
 const t=setInterval(()=>{n--;const c=$('#count');if(c)c.textContent=n||'✓';if(n<=0){clearInterval(t);setTimeout(()=>{M.busy=false;M.caps[M.step]=M.caps[M.step]||'sim';api.call('POST','/v1/measurement-sessions/{id}/captures',CAP[M.step].t+' frame');const nx=M.caps.findIndex(x=>!x);if(nx>=0)M.step=nx;render()},450)}},700);
}
function processScan(){
 const M=S.m;M.stage='processing';M.proc=0;render();
 const t=setInterval(()=>{M.proc++;render();if(M.proc>=5){clearInterval(t);
  const p=prof(M.profileId);const h=M.unit==='cm'?parseFloat(M.height)/2.54:parseFloat(M.height);
  p.m=genM(Math.round(h*10)/10,Date.now()%100000);p.photos=M.keep;p.updated=new Date().toISOString();
  api.call('GET','/v1/measurement-sessions/{id}/result','18 measurements');if(!M.keep)api.call('DELETE','/v1/profiles/{id}/captures','auto-delete raw images');
  S.active=p.id;S.reviewId=p.id;persist();S.m={...S.m,stage:'intro',step:0,caps:[null,null,null],proc:0};setTimeout(()=>go('review'),400)}},650);
}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
 const a=e.target.closest('[data-act],[data-set]');if(!a)return;
 if(a.dataset.set){const f=a.dataset.set,v=a.dataset.val;
  if(f==='m-prof'){S.m.profileId=S.profiles.find(p=>p.name===v).id;const p=prof(S.m.profileId);if(p.m&&!S.m.height){S.m.height=S.m.unit==='cm'?(p.m.height.v*2.54).toFixed(0):p.m.height.v}render();return}
  if(f==='m-unit'){const h=$('#m-h');S.m.height=h?h.value:S.m.height;if(S.m.height&&v!==S.m.unit)S.m.height=v==='cm'?(S.m.height*2.54).toFixed(0):(S.m.height/2.54).toFixed(1);S.m.unit=v;render();return}
  if(f==='p-fit'){const p=prof(S.reviewId)||activeProfile();p.fit=v;persist();render();return}
  const d={...S.draft,[f]:v};if(f==='category'){Object.assign(d,{fabric:null});}setDraft(f==='category'?{...d,fabric:CATS[v].fab[0]}:d,true);render();return}
 const act=a.dataset.act;
 switch(act){
  case'how':go('home',true);setTimeout(()=>$('#how')?.scrollIntoView({behavior:'smooth'}),30);break;
  case'menu':$('#drawer').hidden=!$('#drawer').hidden;break;
  case'search':openSearch();break;
  case'close-search':$('#search').hidden=true;break;
  case'pick-cat':{const c=a.dataset.cat;const base=CATALOG.find(i=>i.spec.category===c);setDraft(base?base.spec:defaultSpec(c));S.prompt='';$('#search').hidden=true;go('design');break}
  case'customize':{const it=CATALOG.find(i=>i.id===a.dataset.id);setDraft(it.spec);S.prompt='';S.recent=[it.id,...S.recent.filter(x=>x!==it.id)].slice(0,8);persist();$('#search').hidden=true;go('design');break}
  case'save':{const id=a.dataset.id;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];persist();render();if(!$('#search').hidden)runSearch();toast(S.saved.includes(id)?'Saved to your styles':'Removed from saved styles');break}
  case'apply-prompt':{S.prompt=$('#prompt').value;const{ch,u}=parsePrompt(S.prompt);api.call('POST','/v1/designs:parse',u.length+' attributes extracted');
   if(!u.length){toast('Add a detail like colour, collar or fit and try again');break}
   const base=ch.category&&ch.category!==S.draft.category?defaultSpec(ch.category):S.draft;setDraft({...base,...ch},true);S.understood=u;render();toast('Design updated from your description');break}
  case'occ':S.occasion=a.dataset.val;api.call('GET','/v1/recommendations','occasion='+S.occasion.toLowerCase());render();break;
  case'use-rec':{const r=recommend(S.occasion)[+a.dataset.i];setDraft(r.spec);render();toast('Applied '+title(r.spec));break}
  case'pv':S.pv=a.dataset.val;render();break;
  case'regen':{const d={...S.draft},c=CATS[d.category];const keys=['collar','pockets','pattern','buttons'].filter(k=>c[k==='collar'?'collars':k]!==null&&(k==='pattern'||(c[k==='collar'?'collars':k]||[]).length>1));
   const k=keys[Math.floor(Math.random()*keys.length)];const list=k==='pattern'?PATTERNS:c[k==='collar'?'collars':k];const opts=list.filter(x=>x!==d[k]);d[k]=opts[Math.floor(Math.random()*opts.length)];
   const v=S.variation+1;setDraft(d,true);S.variation=v;api.call('POST','/v1/designs/{id}:render','variation '+(v+1));render();toast(`Variation ${v+1}: ${k==='collar'?(c.collarLabel||'collar').toLowerCase():k} → ${d[k]}`);break}
  case'save-design':S.designs.unshift({spec:S.draft,at:new Date().toISOString()});api.call('POST','/v1/designs','saved');persist();toast('Design saved to My Designs');break;
  case'to-measure':{const p=activeProfile();S.instructions=$('#instr')?.value||S.instructions;go(p&&p.m?'review':'measure');if(p&&p.m)toast('Using '+p.name+'. Review or retake below.');break}
  case'review-active':S.reviewId=activeProfile().id;go('review');break;
  case'consent':S.m.consent=a.checked;render();break;
  case'consent2':S.m.keep=a.checked;break;
  case'm-start':api.call('POST','/v1/measurement-sessions','consent=true, keep_images='+S.m.keep);S.m.stage='setup';S.m.profileId=S.m.profileId||S.active;{const p=prof(S.m.profileId);if(p&&p.m&&!S.m.height)S.m.height=(p.m.height.v*2.54).toFixed(0)}render();break;
  case'm-manual':{const p=activeProfile();if(!p.m)p.m=genM(68,5);Object.values(p.m).forEach(x=>x.c='Edited');S.reviewId=p.id;persist();go('review');toast('Type your tape measurements over these starting values');break}
  case'm-newprof':$('#newprof').hidden=false;$('#np-name').focus();break;
  case'm-back':S.m.stage='intro';render();break;
  case'm-go':{const nm=$('#np-name');if(nm&&nm.value.trim()){const p={id:'p'+Date.now(),name:nm.value.trim(),rel:'Family',fit:'Tailored',sizes:'',m:null,photos:false,updated:new Date().toISOString()};S.profiles.push(p);S.m.profileId=p.id;api.call('POST','/v1/profiles',p.name)}
   const h=parseFloat($('#m-h').value);const ok=S.m.unit==='cm'?h>=90&&h<=230:h>=36&&h<=90;if(!ok){toast(S.m.unit==='cm'?'Enter a height between 90 and 230 cm':'Enter a height between 36 and 90 in');break}
   if(!S.m.profileId){toast('Choose who you are measuring');break}S.m.height=h;S.m.stage='capture';S.m.step=0;persist();render();break}
  case'm-step':S.m.step=+a.dataset.i;render();break;
  case'm-cap':capture();break;
  case'm-process':processScan();break;
  case'rescan':S.m={...S.m,stage:'setup',profileId:(prof(S.reviewId)||activeProfile()).id,consent:true};go('measure');break;
  case'confirm-meas':{const p=prof(S.reviewId)||activeProfile();S.active=p.id;api.call('PATCH','/v1/profiles/'+p.id,'measurements confirmed');persist();go('preview');toast(locked(p)?p.name+' is Fit Locked. 100% Fit Guarantee applies.':'Continuing at '+fitScore(p).score+'%. Standard alteration policy applies.');break}
  case'del-photos':{const p=prof(a.dataset.id);p.photos=false;api.call('DELETE','/v1/profiles/'+p.id+'/captures','user request');persist();render();toast('Capture photos deleted');break}
  case'angle':stopSpin();setAngle(+a.dataset.val);render();break;
  case'spin':if(spinTimer){stopSpin();render()}else{S.view3d.auto=true;render();spinTimer=setInterval(()=>setAngle((S.view3d.angle+3)%360),40)}break;
  case'add-cart':S.cart.push({spec:S.draft,pid:S.active});persist();render();toast('Added to cart');break;
  case'ord-ok':S.ordOk=a.checked;render();break;
  case'place':{const p=activeProfile(),c=CATS[S.draft.category];const id='DZ-'+(24830+S.orders.length+Math.floor(Math.random()*40));
   S.orders.unshift({id,customer:'Aarav Mehta',profileId:p.id,profileName:p.name,spec:S.draft,m:JSON.parse(JSON.stringify(p.m)),price:price(S.draft),created:new Date().toISOString(),status:1,notes:S.instructions,locked:locked(p),adj:{...(p.adj||{})},ref:p.ref||null,eta:addDays(today,c.days+3).toISOString()});
   api.call('POST','/v1/payments/intents',inr(price(S.draft)));api.call('POST','/v1/orders',id);S.lastOrder=id;S.ordOk=false;persist();go('confirmed');break}
  case'filter':S.filter=a.dataset.val;if(a.dataset.goto)go(a.dataset.goto);else render();break;
  case'cart-rm':S.cart.splice(+a.dataset.i,1);persist();render();break;
  case'cart-order':{const it=S.cart[+a.dataset.i];setDraft(it.spec);if(prof(it.pid))S.active=it.pid;S.cart.splice(+a.dataset.i,1);persist();go('order');break}
  case'dtab':S.dtab=a.dataset.val;S.pendingDel=null;if(S.view!=='account')go('account');else render();break;
  case'open-design':setDraft(S.designs[+a.dataset.i].spec);go('design');break;
  case'review-prof':S.reviewId=a.dataset.id;go('review');break;
  case'scan-prof':S.m={...S.m,stage:'intro',profileId:a.dataset.id};go('measure');break;
  case'activate':S.active=a.dataset.id;persist();render();toast(prof(S.active).name+' will be used for orders');break;
  case'del-prof':S.pendingDel=a.dataset.id;render();break;
  case'del-prof-no':S.pendingDel=null;render();break;
  case'del-prof-yes':{const id=a.dataset.id;if(S.profiles.length<2){toast('Keep at least one profile');break}const n=prof(id).name;S.profiles=S.profiles.filter(p=>p.id!==id);if(S.active===id)S.active=S.profiles[0].id;S.pendingDel=null;api.call('DELETE','/v1/profiles/'+id,'profile and images');persist();render();toast(n+' deleted');break}
  case'add-prof':{const v=$('#add-prof').value.trim();if(!v){toast('Give the profile a name');break}S.profiles.push({id:'p'+Date.now(),name:v,rel:'Family',fit:'Tailored',sizes:'',m:null,photos:false,updated:new Date().toISOString()});api.call('POST','/v1/profiles',v);persist();render();toast(v+' added');break}
  case'verify':{const p=prof(S.reviewId)||activeProfile();const x=p.m[a.dataset.k];x.c='Verified';x.u=true;p.updated=new Date().toISOString();api.call('PATCH','/v1/profiles/'+p.id,a.dataset.k+' verified');persist();render();const sc=fitScore(p).score;toast(sc===100?'Fit Locked. 100% Fit Guarantee applies.':'Confirmed. Fit score '+sc+'%');break}
  case'ref-fix':{const p=prof(S.reviewId)||activeProfile();const k=a.dataset.k;p.m[k]={v:+a.dataset.v,c:'Edited',u:p.m[k].u};persist();render();toast('Updated from your shirt. Fit score '+fitScore(p).score+'%');break}
  case'ref-keep':{const p=prof(S.reviewId)||activeProfile();const k=a.dataset.k,map={chest:['chest',v=>v+EASE[p.fit]],shoulder:['shoulder',v=>v+.3],arm:['sleeve',v=>v],shirtLen:['length',v=>v]};const[rk,fn]=map[k];p.ref[rk]=fn(p.m[k].v).toFixed(1);p.m[k].c='Verified';p.m[k].u=true;persist();render();toast('Kept the scanned value. Your shirt is noted as cut differently there.');break}
  case'fb':{const o=a.dataset.o;S.fb[o]={...(S.fb[o]||{}),[a.dataset.a]:a.dataset.val};render();break}
  case'fb-send':{const o=S.orders.find(x=>x.id===a.dataset.o),f=S.fb[o.id],p=prof(o.profileId);o.feedback=f;
   if(p){p.adj=p.adj||{};Object.entries(f).forEach(([k,v])=>{if(v!=='Perfect'){p.adj[k]=Math.round(((p.adj[k]||0)+(v==='Tight'?.5:-.5))*10)/10;if(!p.adj[k])delete p.adj[k]}})}
   api.call('POST','/v1/orders/'+o.id+'/fit-feedback',Object.entries(f).map(([k,v])=>k+':'+v).join(' '));persist();render();toast(Object.values(f).some(v=>v!=='Perfect')?'Free alteration booked. Fit memory updated.':'Glad it fits perfectly');break}
  case'staff-in':S.staff=true;api.call('GET','/v1/admin/orders','staff role');render();break;
  case'asel':S.adminSel=a.dataset.id;S.copyText=null;render();break;
  case'copy-spec':{const o=S.orders.find(x=>x.id===S.adminSel)||S.orders[0];const txt=specText(o);api.call('GET','/v1/admin/orders/'+o.id+'/spec-sheet','text');
   const fallback=()=>{S.copyText=txt;render();const t=$('#copyarea');t&&t.select();toast('Select all and copy the spec sheet below')};
   try{navigator.clipboard.writeText(txt).then(()=>toast('Spec sheet copied'),fallback)}catch(err){fallback()}break}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.meas){const p=prof(S.reviewId)||activeProfile();const v=parseFloat(t.value);if(isFinite(v)&&v>0){p.m[t.dataset.meas]={v:Math.round(v*10)/10,c:'Edited',u:p.m[t.dataset.meas].u};p.updated=new Date().toISOString();persist();render();toast('Updated. Edited values are made exactly as entered.')}}
 if(t.dataset.ref){const p=prof(S.reviewId)||activeProfile();p.ref={...(p.ref||{}),[t.dataset.ref]:t.value};api.call('PATCH','/v1/profiles/'+p.id,'reference garment '+t.dataset.ref);persist();render();const nx=REF.find(([k])=>!p.ref[k]);if(nx)$('#ref-'+nx[0])?.focus()}
 if(t.id==='instr')S.instructions=t.value;
 if(t.id==='ord-prof'){S.active=t.value;persist();render()}
 if(t.dataset.status){const o=S.orders.find(x=>x.id===t.dataset.status);o.status=+t.value;api.call('PATCH','/v1/admin/orders/'+o.id+'/status',STATUSES[o.status]);persist();render();toast(o.id+' → '+STATUSES[o.status])}
 if(t.dataset.upload&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{if(t.dataset.upload==='cap'){S.m.caps[S.m.step]=r.result;api.call('POST','/v1/measurement-sessions/{id}/captures','uploaded '+CAP[S.m.step].t);const nx=S.m.caps.findIndex(x=>!x);if(nx>=0)S.m.step=nx}else{S.refs[t.dataset.upload]=r.result;api.call('POST','/v1/designs:parse','reference image');toast('Image added. The studio will use it to guide your design.')}render()};r.readAsDataURL(t.files[0])}
});
document.addEventListener('click',e=>{if(e.target.closest('tr[data-act="asel"] select'))e.stopPropagation()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#search').hidden=true;if(e.key==='Enter'&&e.target.id==='prompt'&&(e.metaKey||e.ctrlKey))$('[data-act="apply-prompt"]').click()});

function openSearch(){$('#search').hidden=false;$('#drawer').hidden=true;const q=$('#q');q.focus();runSearch()}
function runSearch(){const q=$('#q').value.trim();const out=$('#sout');
 if(!q){out.innerHTML=`<p class="glabel">Try</p><div class="chips">${['Black slim-fit office shirt','Wedding kurta under ₹5,000','Casual linen shirt','Blue blazer for wedding','Latest co-ord sets','Pathani for Eid','Lehenga in dusty rose','Wide-leg linen trousers'].map(x=>`<button class="chip" data-sq="${x}">${x}</button>`).join('')}</div>`;return}
 const r=parseSearch(q);
 out.innerHTML=`${r.u.length?`<div class="understood"><span class="muted">Showing</span>${r.u.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${r.items.length?`<div class="sres">${r.items.slice(0,9).map(card).join('')}</div>`:`<div class="empty"><b>No ready designs match that yet</b><p>Describe it in the studio and we'll make it from scratch.</p><button class="btn btn-primary" data-act="search-studio">Design “${esc(q)}”</button></div>`}`;
}
$('#q').addEventListener('input',()=>{clearTimeout(runSearch.t);runSearch.t=setTimeout(()=>{runSearch();if($('#q').value.trim().length>3)api.call('GET','/v1/catalog/search?q=',$('#q').value.trim())},220)});
$('#search').addEventListener('click',e=>{if(e.target.id==='search')$('#search').hidden=true;const s=e.target.closest('[data-sq]');if(s){$('#q').value=s.dataset.sq;runSearch()}
 if(e.target.closest('[data-act="search-studio"]')){S.prompt=$('#q').value;const{ch,u}=parsePrompt(S.prompt);const base=ch.category?defaultSpec(ch.category):S.draft;setDraft({...base,...ch},true);S.understood=u;$('#search').hidden=true;go('design')}});

const h0=(location.hash||'').slice(1);if(V[h0])S.view=h0;
render();
</script>
