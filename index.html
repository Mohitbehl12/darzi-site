<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Darzi — design custom clothes and capture your measurements from your phone. Test build.">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Darzi Digital Tailor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: fitting room — quiet paper ground, garments shown on pattern-paper "fitting cards", measurements set in mono on tape-yellow tags */
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE7; --ink:#131715; --muted:#5B6560; --line:#D7DDD8;
  --accent:#1E4D3F; --accent-ink:#F2F7F4; --accent-soft:#DAE7E0; --tape:#E4B12B; --tape-ink:#2A2106;
  --good:#2D7A4D; --warn:#9C6410; --bad:#AE412D; --mq:#C9D0CB; --grid:rgba(30,77,63,.10);
  --shadow:0 1px 2px rgba(19,23,21,.05),0 10px 30px rgba(19,23,21,.07);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1210; --surface:#161C19; --sunk:#1D2521; --ink:#E8EDEA; --muted:#98A49E; --line:#29332E;
  --accent:#7DC3A7; --accent-ink:#0A1511; --accent-soft:#1D372E; --tape:#E8BA36; --tape-ink:#221A03;
  --good:#5DBE85; --warn:#E2A644; --bad:#E57D66; --mq:#313B36; --grid:rgba(125,195,167,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1210; --surface:#161C19; --sunk:#1D2521; --ink:#E8EDEA; --muted:#98A49E; --line:#29332E;
  --accent:#7DC3A7; --accent-ink:#0A1511; --accent-soft:#1D372E; --tape:#E8BA36; --tape-ink:#221A03;
  --good:#5DBE85; --warn:#E2A644; --bad:#E57D66; --mq:#313B36; --grid:rgba(125,195,167,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(2.4rem,5.4vw,4.4rem)}
h2{font-size:clamp(1.8rem,3.4vw,2.7rem)}
h3{font-size:1.35rem}
h1 em,h2 em{font-style:italic;color:var(--accent)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-tape{background:var(--tape);color:var(--tape-ink)}
.btn-lg{padding:14px 24px;font-size:1rem}
.btn-sm{padding:7px 13px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:baseline;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;gap:4px}
.links button{background:none;border:0;padding:8px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.9rem}
.links button:hover,.links button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.icons{display:flex;gap:4px;align-items:center}
.ibtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.drawer{border-top:1px solid var(--line);padding-block:10px 16px}
.drawer button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px;font-size:1.05rem;border-bottom:1px solid var(--line);cursor:pointer}
@media (max-width:1020px){.links{display:none}.menu-btn{display:grid}.nav .cta-nav{display:none}}

/* hero */
.hero{padding-block:48px 64px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:22px;min-width:0}
.lede{font-size:1.14rem;color:var(--muted);max-width:34em}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.trust{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.88rem;color:var(--muted)}
.trust li{display:flex;align-items:center;gap:8px}
.trust li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tape)}
.fitcard{position:relative;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;aspect-ratio:3/3.6;max-width:100%;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:14px 14px}
.fitcard .layer{position:absolute;inset:4% 6% 6%}
.fitcard svg{width:100%;height:100%;display:block}
.scanbar{position:absolute;left:0;right:0;height:70px;top:10%;background:linear-gradient(180deg,transparent,var(--grid),transparent);border-bottom:1px solid var(--accent);opacity:.7;animation:scan 5.5s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:78%}}
.chipfloat{position:absolute;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:.82rem}
.chipfloat b{display:block;font-size:.9rem}
.cf1{left:16px;bottom:16px}
.cf2{right:16px;top:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.tape-tag rect{fill:var(--tape)}
.tape-tag text{fill:var(--tape-ink);font-family:var(--mono);font-size:8.6px;font-weight:500}
.mline{stroke:var(--accent);stroke-width:1.2;fill:none}
.mend{fill:var(--accent)}
.draw{stroke-dasharray:240;animation:draw 1.6s ease-out both}
@keyframes draw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding-block:28px 40px}.fitcard{aspect-ratio:3/3.3}}

/* sections */
.band{padding-block:72px}
.band-alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.sec-head p{max-width:36em;color:var(--muted)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step4{display:flex;flex-direction:column;gap:12px}
.step4 .ill{aspect-ratio:4/3;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.step4 .ill svg{width:62%;height:84%}
.step4 h3{font-size:1.25rem;display:flex;gap:10px;align-items:baseline}
.step4 h3::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.8rem;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;flex:none;transform:translateY(-3px)}
@media (max-width:900px){.steps4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .thumb{aspect-ratio:3/3.4;border-radius:12px;background:var(--sunk);overflow:hidden}
.cat .thumb svg{width:100%;height:100%}
.cat b{font-weight:600;font-size:.98rem}
.cat span{font-size:.8rem;color:var(--muted)}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,1fr)}}

.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split>*{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:28px}}
.prompt-demo{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.quote{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:.74rem;padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.tag.tp{background:var(--tape);color:var(--tape-ink)}
.mini-res{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;font-size:.9rem;align-items:center}
.conf{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.conf.High{color:var(--good)}.conf.Medium{color:var(--warn)}.conf.Low{color:var(--bad)}.conf.Verified,.conf.Edited{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.mtable tr.needs td{background:color-mix(in srgb,var(--tape) 10%,transparent)}
.mtable .tip{color:var(--muted);display:block;max-width:34ch;line-height:1.35;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fitmeter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.fitmeter.lock{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fitnum{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.fitmeter.lock .fitnum{color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--tape);transition:width .4s}
.fitmeter.lock .bar span{background:var(--accent)}
.gates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gates li{display:flex;gap:10px;align-items:flex-start}
.gates li div{display:flex;flex-direction:column;min-width:0}
.gates b{font-size:.9rem;font-weight:600}
.gi{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;border:1.5px solid var(--line);color:var(--muted)}
.gates li.ok .gi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gates li.bad .gi{border-color:var(--bad);color:var(--bad)}
.refgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.refgrid{grid-template-columns:1fr 1fr}}
.guarantee{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--accent);border-radius:var(--r);padding:16px;background:var(--accent-soft)}
.seal{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;font-weight:600}
.privacy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{border-top:2px solid var(--accent);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.pcard b{font-size:1.02rem}
@media (max-width:760px){.privacy-grid{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:40px;color:var(--muted);font-size:.88rem}
.foot{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.foot button:hover{color:var(--ink)}

/* flow */
.page{padding-block:28px 72px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:26px;scrollbar-width:none}
.stepper button{flex:none;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.stepper button i{font-style:normal;font-family:var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:.72rem}
.stepper button.done{color:var(--ink)}
.stepper button.done i{background:var(--accent-soft);color:var(--accent)}
.stepper button.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.stepper button.cur i{background:var(--accent);color:var(--accent-ink)}
.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:46em}
.page-head p{color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{font-family:var(--body);font-weight:700;font-size:1rem;letter-spacing:0}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
@media (max-width:920px){.studio{grid-template-columns:1fr}.studio .preview-col{order:-1;position:static!important}}
.preview-col{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:9px;padding-block:14px;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group>label,.glabel{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:.72rem}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
textarea,input[type=text],input[type=number],input[type=email],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:.95rem}
textarea{min-height:92px;resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;cursor:pointer;font-size:.85rem;position:relative;min-height:92px}
.drop:hover{border-color:var(--accent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.preview-box{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:14px 14px}
.preview-box .gwrap{aspect-ratio:3/3.5;max-width:100%;display:grid;place-items:center;padding:10px 14px}
.preview-box .gwrap svg{width:100%;height:100%;max-height:520px}
.ai-label{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.vtabs{position:absolute;right:12px;top:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.vtabs button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:.76rem;cursor:pointer;color:var(--muted)}
.vtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:.9rem}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600;min-width:0}
.price-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-family:var(--display);font-size:1.8rem}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rec{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--surface);font-size:.8rem}
.rec .thumb{aspect-ratio:1;background:var(--sunk);border-radius:8px;overflow:hidden}
.rec .thumb svg{width:100%;height:100%}
.rec b{font-size:.84rem}
@media (max-width:520px){.recs{grid-template-columns:1fr 1fr}.uploads{grid-template-columns:1fr}}

.mq{fill:var(--mq);stroke:none}
.mqs{stroke:var(--mq);fill:none}

/* measure */
.measure-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:start}
@media (max-width:860px){.measure-grid{grid-template-columns:1fr}}
.cam{position:relative;border-radius:22px;background:#0F1412;overflow:hidden;aspect-ratio:3/4;max-height:72vh;margin-inline:auto;width:100%;max-width:520px}
.cam .guide{position:absolute;inset:6% 10%}
.cam .guide svg{width:100%;height:100%}
.cam .corner{position:absolute;width:28px;height:28px;border:2.5px solid #E4B12B}
.cam .c1{left:7%;top:4%;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam .c2{right:7%;top:4%;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.cam .c3{left:7%;bottom:4%;border-right:0;border-top:0;border-radius:0 0 0 8px}
.cam .c4{right:7%;bottom:4%;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.72rem;color:#DDE6E1}
.cam .hud span{background:rgba(0,0,0,.45);padding:4px 9px;border-radius:999px}
.cam .count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:6rem;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.cam .scanline{position:absolute;left:8%;right:8%;height:2px;background:#7DC3A7;box-shadow:0 0 18px 4px rgba(125,195,167,.55);animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:8%}50%{top:90%}}

  <div class="row"><button class="btn ${F.score===100?'btn-primary':'btn-ghost'} btn-lg" data-act="confirm-meas">${F.score===100?'Lock fit &amp; continue':`Continue at ${F.score}%`}</button><button class="btn btn-ghost" data-act="rescan">Retake scan</button></div>
 </div></div></div>`;
};

function finished(d,m,adj){return finished0(d,m).map(([l,v])=>[l,v+((adj||{})[l]||0)])}
function finished0(d,m){const e=EASE[d.fit];const lenAdj={'Extended':2,'Cropped':-2.5,'Mid-calf':4,'Short kurta':-6,'Knee length':0}[d.length]||0;const base=d.category==='kurta'?m.shirtLen.v+9:d.category==='blouse'?m.shirtLen.v*.5:m.shirtLen.v;
 const sl={Full:m.arm.v,'Three-quarter':m.arm.v*.72,Half:m.arm.v*.4,Sleeveless:0}[d.sleeves]??m.arm.v;
 const kind=CATS[d.category].kind;
 if(kind==='bottom')return[['Waist',m.trouserWaist.v+1],['Hip',m.hip.v+e],['Thigh',m.thigh.v+2.5],['Inseam',m.inseam.v-(d.length==='Ankle'?1.5:d.length==='Cropped'?4:0)]];
 return[['Chest',m.chest.v+e],['Waist',m.waist.v+e+.5],['Shoulder',m.shoulder.v+.3],['Length',base+lenAdj],...(sl?[['Sleeve',sl]]:[])].concat(d.length==='Longer back'?[['Back length',base+1]]:[]);
}

function rotSVG(a){const r=a*Math.PI/180,cs=Math.cos(r),sx=Math.max(.36,Math.abs(cs)).toFixed(3);const view=cs>=0?'front':'back';
 return garmentSVG(S.draft,view).replace(/<g stroke=/, `<g transform="translate(150 0) scale(${sx} 1) translate(-150 0)"><g stroke=`).replace(/<\/svg>$/,'</g></svg>')}

const srv={
 async req(method,path,body){
  const h={'content-type':'application/json'};if(S.auth)h.authorization='Bearer '+S.auth.token;
  const slow=setTimeout(()=>toast('Waking up the server, this can take up to a minute the first time…'),3500);
  let r;try{r=await fetch(API_BASE+'/api'+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}catch(e){clearTimeout(slow);throw new Error('Can’t reach the server. Check your internet connection and try again.')}
  clearTimeout(slow);const j=await r.json().catch(()=>({}));
  if(r.status===401&&S.auth){signOut(true);throw new Error(j.error||'Please sign in again')}
  if(!r.ok)throw new Error(j.error||'Something went wrong. Please try again.');return j},
};

  case'copy-spec':{const L=isStaff()&&!S.staffDemo?S.ad.orders:S.orders;const o=L.find(x=>x.id===S.adminSel)||L[0];const txt=specText(o);api.call('GET','/v1/admin/orders/'+o.id+'/spec-sheet','text');
   const fallback=()=>{S.copyText=txt;render();const t=$('#copyarea');t&&t.select();toast('Select all and copy the spec sheet below')};
   try{navigator.clipboard.writeText(txt).then(()=>toast('Spec sheet copied'),fallback)}catch(err){fallback()}break}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.meas){const p=prof(S.reviewId)||activeProfile();const v=parseFloat(t.value),k=t.dataset.meas,old=p.m[k];if(isFinite(v)&&v>0){
   p.m[k]={v:Math.round(v*10)/10,c:'Edited',u:old.u,src:'you',scan:old.src==='photo'?old.v:old.scan};p.updated=new Date().toISOString();
   const base=p.m[k].scan;S.calib=null;
   if(base&&GIRTHS.includes(k)){const ratio=v/base;const targets=GIRTHS.filter(g=>g!==k&&p.m[g]&&p.m[g].src==='photo'&&!['Edited','Verified'].includes(p.m[g].c));if(Math.abs(ratio-1)>.015&&targets.length)S.calib={pid:p.id,from:k,ratio,targets}}
   persist();render();toast('Updated. Edited values are made exactly as entered.')}}
 if(t.dataset.ref){const p=prof(S.reviewId)||activeProfile();p.ref={...(p.ref||{}),[t.dataset.ref]:t.value};api.call('PATCH','/v1/profiles/'+p.id,'reference garment '+t.dataset.ref);persist();render();const nx=REF.find(([k])=>!p.ref[k]);if(nx)$('#ref-'+nx[0])?.focus()}
 if(t.id==='m-prof'){const nm=$('#np-name');if(t.value==='__new'){nm.hidden=false;nm.focus()}else{nm.hidden=true;S.m.profileId=t.value;prefillHeight();render()}}
 if(t.classList&&t.classList.contains('stockin')){const b={};b[t.dataset.k]=+t.value;srv.req('PATCH','/admin/fabrics/'+t.dataset.fab,b).then(j=>{const i=S.ad.fabrics.findIndex(x=>x.id==t.dataset.fab);S.ad.fabrics[i]=j.fabric;render();toast('Stock updated')}).catch(e=>toast(e.message))}
 if(t.id==='instr')S.instructions=t.value;
 if(t.id==='ord-prof'){S.active=t.value;persist();render()}
 if(t.dataset.status&&isStaff()&&!S.staffDemo){const id=t.dataset.status,st=+t.value;srv.req('PATCH','/admin/orders/'+id,{status:st}).then(j=>{const i=S.ad.orders.findIndex(x=>x.id===id);S.ad.orders[i]={...S.ad.orders[i],...mapOrder(j.order)};delete S.ad.events[id];render();toast(id+' → '+STATUSES[st]+'. Customer notified.')}).catch(e=>{toast(e.message);render()});return}
 if(t.dataset.status){const o=S.orders.find(x=>x.id===t.dataset.status);o.status=+t.value;api.call('PATCH','/v1/admin/orders/'+o.id+'/status',STATUSES[o.status]);persist();render();toast(o.id+' → '+STATUSES[o.status])}
 if(t.dataset.upload&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{if(/^cap\d$/.test(t.dataset.upload)){readWho();readHeight();S.m.caps[+t.dataset.upload.slice(3)]=r.result;api.call('POST','/v1/measurement-sessions/{id}/captures','uploaded photo')}else{S.refs[t.dataset.upload]=r.result;api.call('POST','/v1/designs:parse','reference image');toast('Image added. The studio will use it to guide your design.')}render()};r.readAsDataURL(t.files[0])}
});
document.addEventListener('click',e=>{if(e.target.closest('tr[data-act="asel"] select'))e.stopPropagation()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#search').hidden=true;if(e.key==='Enter'&&e.target.id==='prompt'&&(e.metaKey||e.ctrlKey))$('[data-act="apply-prompt"]').click()});

function openSearch(){$('#search').hidden=false;$('#drawer').hidden=true;const q=$('#q');q.focus();runSearch()}
function runSearch(){const q=$('#q').value.trim();const out=$('#sout');
 if(!q){out.innerHTML=`<p class="glabel">Try</p><div class="chips">${['Black slim-fit office shirt','Wedding kurta under ₹5,000','Casual linen shirt','Blue blazer for wedding','Latest co-ord sets','Pathani for Eid','Lehenga in dusty rose','Wide-leg linen trousers'].map(x=>`<button class="chip" data-sq="${x}">${x}</button>`).join('')}</div>`;return}
 const r=parseSearch(q);
 out.innerHTML=`${r.u.length?`<div class="understood"><span class="muted">Showing</span>${r.u.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}${r.items.length?`<div class="sres">${r.items.slice(0,9).map(card).join('')}</div>`:`<div class="empty"><b>No ready designs match that yet</b><p>Describe it in the studio and we'll make it from scratch.</p><button class="btn btn-primary" data-act="search-studio">Design “${esc(q)}”</button></div>`}`;
}
document.addEventListener('input',e=>{if(e.target.id==='ad-q'){S.ad.q=e.target.value;clearTimeout(adQ);adQ=setTimeout(()=>{render();const el=$('#ad-q');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});let adQ=null;
$('#q').addEventListener('input',()=>{clearTimeout(runSearch.t);runSearch.t=setTimeout(()=>{runSearch();if($('#q').value.trim().length>3)api.call('GET','/v1/catalog/search?q=',$('#q').value.trim())},220)});
$('#search').addEventListener('click',e=>{if(e.target.id==='search')$('#search').hidden=true;const s=e.target.closest('[data-sq]');if(s){$('#q').value=s.dataset.sq;runSearch()}
 if(e.target.closest('[data-act="search-studio"]')){S.prompt=$('#q').value;const{ch,u}=parsePrompt(S.prompt);const base=ch.category?defaultSpec(ch.category):S.draft;setDraft({...base,...ch},true);S.understood=u;$('#search').hidden=true;go('design')}});

const h0=(location.hash||'').slice(1);if(V[h0])S.view=h0;
srv.req('GET','/health').then(j=>{S.health=j;if(S.view==='order')render()}).catch(()=>{});
if(S.auth){loadMe().then(()=>{if(isStaff())return adLoad()}).then(render).catch(e=>console.warn(e))}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==S.view)go(h)});
render();
</script>
